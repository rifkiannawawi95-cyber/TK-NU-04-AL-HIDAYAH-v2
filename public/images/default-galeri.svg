<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="primaryNuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875A"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Rings / Patterns -->
  <circle cx="80" cy="90" r="140" fill="#059669" fill-opacity="0.05"/>
  <circle cx="530" cy="380" r="180" fill="#059669" fill-opacity="0.05"/>
  <circle cx="520" cy="80" r="16" fill="url(#goldGrad)" fill-opacity="0.8"/>
  <circle cx="70" cy="380" r="12" fill="url(#goldGrad)" fill-opacity="0.6"/>
  <polygon points="500,140 508,156 526,158 512,170 516,188 500,178 484,188 488,170 474,158 492,156" fill="url(#goldGrad)" opacity="0.4" transform="scale(0.8) translate(130, 20)"/>

  <!-- Center Card -->
  <rect x="130" y="70" width="340" height="310" rx="32" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Camera / Gallery Icon Container -->
  <circle cx="300" cy="185" r="58" fill="url(#primaryNuGrad)"/>
  
  <!-- Camera Illustration -->
  <g fill="#ffffff" transform="translate(262, 147) scale(1.15)">
    <!-- Camera Body -->
    <path d="M5 16 C5 13.8 6.8 12 9 12 L16 12 L19 8 L33 8 L36 12 L43 12 C45.2 12 47 13.8 47 16 L47 43 C47 45.2 45.2 47 43 47 L9 47 C6.8 47 5 45.2 5 43 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Flash/Button -->
    <circle cx="39" cy="19" r="2.5" fill="#f59e0b"/>
    <!-- Outer Lens -->
    <circle cx="26" cy="30" r="12" fill="#065f46"/>
    <!-- Inner Lens Ring -->
    <circle cx="26" cy="30" r="8" fill="#10b981"/>
    <!-- Lens Reflection -->
    <circle cx="29" cy="27" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="300" y="285" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#064e3b" text-anchor="middle" letter-spacing="-0.3">
    TK NU 04 AL-HIDAYAH
  </text>
  <text x="300" y="312" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">
    Dokumentasi Foto Kegiatan
  </text>
  <rect x="235" y="332" width="130" height="24" rx="12" fill="#064e3b" fill-opacity="0.08"/>
  <text x="300" y="348" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">
    Preview Galeri
  </text>
</svg>

